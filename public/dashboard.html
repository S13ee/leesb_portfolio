<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비공개 영역</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-gray { background: #e5e7eb; color: #333; }
  .msg {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-top: 10px;
  }
  .msg.ok { background: #d1fae5; color: #065f46; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  .passkey-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .passkey-item:last-child { border-bottom: none; }
  .content-item {
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 0.95rem;
  }
  .content-item:last-child { border-bottom: none; }
  #section-login, #section-dashboard { display: none; }
</style>
</head>
<body>
<div class="container">

  <!-- 로그인 영역 -->
  <div id="section-login">
    <h1>비공개 영역</h1>

    <div class="card">
      <h2>패스키 등록</h2>
      <input type="text" id="reg-username" placeholder="사용자 이름">
      <input type="text" id="reg-devicename" placeholder="기기 이름 (예: 맥북, 아이폰)">
      <button class="btn-primary" onclick="registerPasskey()">패스키 등록</button>
      <div id="reg-msg"></div>
    </div>

    <div class="card">
      <h2>패스키로 로그인</h2>
      <input type="text" id="login-username" placeholder="사용자 이름">
      <button class="btn-primary" onclick="loginPasskey()">로그인</button>
      <div id="login-msg"></div>
    </div>
  </div>

  <!-- 대시보드 영역 -->
  <div id="section-dashboard">
    <h1>안녕하세요, <span id="display-username"></span>님</h1>

    <div class="card">
      <h2>내 비공개 콘텐츠</h2>
      <div id="contents-list"></div>
    </div>

    <div class="card">
      <h2>등록된 패스키</h2>
      <div id="passkeys-list"></div>
      <hr style="margin: 16px 0;">
      <h2>새 패스키 추가</h2>
      <input type="text" id="add-devicename" placeholder="기기 이름">
      <button class="btn-primary" onclick="addPasskey()">추가</button>
      <div id="add-msg"></div>
    </div>

    <button class="btn-gray" onclick="logout()">로그아웃</button>
  </div>

</div>

<script>
const BASE = '';
let currentToken = localStorage.getItem('passkey_token');
let currentUsername = localStorage.getItem('passkey_username');
let currentUserId = localStorage.getItem('passkey_userid');

function showMsg(id, text, isOk) {
  const el = document.getElementById(id);
  el.className = 'msg ' + (isOk ? 'ok' : 'err');
  el.textContent = text;
}

function bufferToBase64url(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

function base64urlToBuffer(base64url) {
  const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(base64);
  return Uint8Array.from(bin, c => c.charCodeAt(0)).buffer;
}

async function registerPasskey() {
  const username = document.getElementById('reg-username').value.trim();
  const deviceName = document.getElementById('reg-devicename').value.trim();
  if (!username) return showMsg('reg-msg', '사용자 이름을 입력해 주세요', false);

  try {
    const r1 = await fetch('/api/register-start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username }),
    });
    const { options, userId } = await r1.json();

    options.challenge = base64urlToBuffer(options.challenge);
    options.user.id = base64urlToBuffer(options.user.id);
    if (options.excludeCredentials) {
      options.excludeCredentials = options.excludeCredentials.map(c => ({
        ...c, id: base64urlToBuffer(c.id)
      }));
    }

    const credential = await navigator.credentials.create({ publicKey: options });

    const credJson = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        attestationObject: bufferToBase64url(credential.response.attestationObject),
      },
    };

    const r2 = await fetch('/api/register-finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, credential: credJson, deviceName }),
    });
    const result = await r2.json();
    if (result.success) showMsg('reg-msg', '패스키 등록 완료!', true);
    else showMsg('reg-msg', result.error || '등록 실패', false);
  } catch (e) {
    showMsg('reg-msg', '오류: ' + e.message, false);
  }
}

async function loginPasskey() {
  const username = document.getElementById('login-username').value.trim();
  if (!username) return showMsg('login-msg', '사용자 이름을 입력해 주세요', false);

  try {
    const r1 = await fetch('/api/login-start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username }),
    });
    const { options, userId } = await r1.json();

    options.challenge = base64urlToBuffer(options.challenge);
    if (options.allowCredentials) {
      options.allowCredentials = options.allowCredentials.map(c => ({
        ...c, id: base64urlToBuffer(c.id)
      }));
    }

    const credential = await navigator.credentials.get({ publicKey: options });

    const credJson = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        authenticatorData: bufferToBase64url(credential.response.authenticatorData),
        signature: bufferToBase64url(credential.response.signature),
        userHandle: credential.response.userHandle
          ? bufferToBase64url(credential.response.userHandle) : null,
      },
    };

    const r2 = await fetch('/api/login-finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, credential: credJson }),
    });
    const result = await r2.json();

    if (result.success) {
      localStorage.setItem('passkey_token', result.token);
      localStorage.setItem('passkey_username', username);
      localStorage.setItem('passkey_userid', userId);
      currentToken = result.token;
      currentUsername = username;
      currentUserId = userId;
      showDashboard();
    } else {
      showMsg('login-msg', result.error || '로그인 실패', false);
    }
  } catch (e) {
    showMsg('login-msg', '오류: ' + e.message, false);
  }
}

async function addPasskey() {
  const deviceName = document.getElementById('add-devicename').value.trim();
  try {
    const r1 = await fetch('/api/register-start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: currentUsername }),
    });
    const { options, userId } = await r1.json();

    options.challenge = base64urlToBuffer(options.challenge);
    options.user.id = base64urlToBuffer(options.user.id);
    if (options.excludeCredentials) {
      options.excludeCredentials = options.excludeCredentials.map(c => ({
        ...c, id: base64urlToBuffer(c.id)
      }));
    }

    const credential = await navigator.credentials.create({ publicKey: options });

    const credJson = {
      id: credential.id,
      rawId: bufferToBase64url(credential.rawId),
      type: credential.type,
      response: {
        clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
        attestationObject: bufferToBase64url(credential.response.attestationObject),
      },
    };

    const r2 = await fetch('/api/register-finish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, credential: credJson, deviceName }),
    });
    const result = await r2.json();
    if (result.success) {
      showMsg('add-msg', '패스키 추가 완료!', true);
      loadPasskeys();
    } else {
      showMsg('add-msg', result.error || '추가 실패', false);
    }
  } catch (e) {
    showMsg('add-msg', '오류: ' + e.message, false);
  }
}

async function deletePasskey(credentialId) {
  if (!confirm('이 패스키를 삭제할까요?')) return;
  const r = await fetch('/api/passkeys', {
    method: 'DELETE',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + currentToken,
    },
    body: JSON.stringify({ credentialId }),
  });
  const result = await r.json();
  if (result.success) loadPasskeys();
  else alert(result.error);
}

async function loadPasskeys() {
  const r = await fetch('/api/passkeys', {
    headers: { 'Authorization': 'Bearer ' + currentToken },
  });
  const { credentials } = await r.json();
  const list = document.getElementById('passkeys-list');
  if (!credentials || credentials.length === 0) {
    list.innerHTML = '<p style="color:#999;font-size:0.9rem;">등록된 패스키 없음</p>';
    return;
  }
  list.innerHTML = credentials.map(c => `
    <div class="passkey-item">
      <div>
        <div style="font-weight:500">${c.device_name}</div>
        <div style="font-size:0.82rem;color:#999">${new Date(c.created_at).toLocaleDateString('ko-KR')}</div>
      </div>
      <button class="btn-danger" onclick="deletePasskey('${c.id}')">삭제</button>
    </div>
  `).join('');
}

async function loadContents() {
  const r = await fetch('/api/private', {
    headers: { 'Authorization': 'Bearer ' + currentToken },
  });
  const result = await r.json();
  if (r.status === 401) {
    logout();
    return;
  }
  document.getElementById('display-username').textContent = result.username;
  const list = document.getElementById('contents-list');
  if (!result.contents || result.contents.length === 0) {
    list.innerHTML = '<p style="color:#999;font-size:0.9rem;">비공개 콘텐츠가 없습니다</p>';
  } else {
    list.innerHTML = result.contents.map(c =>
      `<div class="content-item">${c.content}</div>`
    ).join('');
  }
}

function showDashboard() {
  document.getElementById('section-login').style.display = 'none';
  document.getElementById('section-dashboard').style.display = 'block';
  loadContents();
  loadPasskeys();
}

function showLogin() {
  document.getElementById('section-login').style.display = 'block';
  document.getElementById('section-dashboard').style.display = 'none';
}

async function logout() {
  if (currentToken) {
    await fetch('/api/logout', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + currentToken },
    });
  }
  localStorage.removeItem('passkey_token');
  localStorage.removeItem('passkey_username');
  localStorage.removeItem('passkey_userid');
  currentToken = null;
  currentUsername = null;
  currentUserId = null;
  showLogin();
}

// 초기화
if (currentToken) {
  showDashboard();
} else {
  showLogin();
}
</script>
</body>
</html>
